name: Bug report
description: Report a non-security defect using sanitized information.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use https://github.com/zeidlern/NerdSSHell/security/advisories/new instead. Never include credentials, private keys, real connection settings, or unredacted terminal recordings."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior and actual behavior
      description: Describe a minimal reproduction using disposable sessions and synthetic output. Include sanitized screenshots or short logs when useful.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows version and session type
      description: Include Windows version and local PowerShell/CMD or remote Persistent/Standard SSH. Add server/tmux versions if relevant; omit usernames, addresses, private paths and full profiles.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed sensitive and personal information from this report.
          required: true
