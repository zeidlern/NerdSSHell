name: CodeQL JavaScript and Actions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  public:
  schedule:
    - cron: '41 7 * * 2'
permissions:
  contents: read
jobs:
  analyze:
    # Public repositories run CodeQL automatically. While private, it runs only
    # after GitHub Code Security is enabled and the repository variable is set.
    if: github.event.repository.visibility == 'public' || vars.NERDSSHELL_CODEQL_ENABLED == 'true' || vars.BETTERSSH_CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
