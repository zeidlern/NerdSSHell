name: Publish authorized 1.2.2 input fix
on:
  workflow_run:
    workflows: [Validate and build NerdSSHell]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-nerdsshell-1.2.2
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'zeidlern/NerdSSHell' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Limit this authorization to version 1.2.2
        id: version
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'eligible=' + (require('./package.json').version === '1.2.2') + '\n')"
      - name: Verify publication guards
        if: steps.version.outputs.eligible == 'true'
        run: node --test test/release-publication.test.cjs
      - name: Verify accepted main and prepare consumer assets
        if: steps.version.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/Publish-Input-Fix.cjs prepare
      - name: Preserve verified consumer assets before publication
        if: steps.version.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NerdSSHell-1.2.2-release-files
          path: ${{ runner.temp }}/consumer-release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish draft only after verifying every asset
        if: steps.version.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/Publish-Input-Fix.cjs publish
