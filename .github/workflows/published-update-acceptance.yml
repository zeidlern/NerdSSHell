name: Published Windows update acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - scripts/Published-Update-Smoke.cjs
      - scripts/Verify-Packaged.cjs
      - test/published-update-acceptance.test.cjs
      - .github/workflows/published-update-acceptance.yml
      - src/release-transport.cjs
      - src/release-updater.cjs
      - src/update-handoff.cjs
      - src/update-runner.ps1
permissions:
  contents: read
concurrency:
  group: nerdsshell-published-update-acceptance
  cancel-in-progress: false
jobs:
  published-update:
    if: ${{ github.repository == 'zeidlern/NerdSSHell' && github.actor == 'zeidlern' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      NERDSSHELL_ACCEPTANCE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - run: npm ci --omit=optional
      - name: Check workstation, runner and fork refusal before installation
        run: node --test test/published-update-acceptance.test.cjs
      - run: npm run check
      - run: node scripts/Generate-SupplyChain.cjs
      - run: npm run dist
      - run: npm run verify:package
      - name: Legacy refusal and patched candidate transport with actual public NSIS in this disposable VM
        run: node scripts/Published-Update-Smoke.cjs
      - name: Preserve bounded acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NerdSSHell-published-update-acceptance
          retention-days: 14
          include-hidden-files: true
          path: .local/published-update-acceptance/*.json
          if-no-files-found: warn
